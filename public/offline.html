<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2b2b2b">
    <title>Hors ligne — Alga</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: #2b2b2b;
            color: #f3ead8;
            font-family: Outfit, "Segoe UI", sans-serif;
            text-align: center;
        }
        img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 1rem; }
        h1 { font-family: Syne, Outfit, sans-serif; font-size: 2rem; letter-spacing: -0.04em; margin: 0 0 0.4rem; }
        p { margin: 0 0 1.2rem; color: #cfc6b6; max-width: 22rem; }
        button {
            font: inherit;
            font-weight: 700;
            border: 0;
            border-radius: 999px;
            padding: 0.7rem 1.2rem;
            background: #8fb89a;
            color: #1a1712;
        }
    </style>
</head>
<body>
    <div>
        <img src="/img/alga.png" width="72" height="72" alt="">
        <h1>Alga est hors ligne</h1>
        <p>Le board a besoin d’un réseau pour afficher le jour. Réessaie dès que tu as du signal.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
